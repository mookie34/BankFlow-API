name: BankFlow CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test tests/BankFlow.UnitTests \
            --configuration Release \
            --no-build \
            --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    name: Docker Build

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bankflow-api:${{ github.sha }} .

      - name: Tag as latest
        run: docker tag bankflow-api:${{ github.sha }} bankflow-api:latest